# Proposes updates for everything that is pinned: npm packages, the GitHub Actions (pinned by
# SHA, with the version in a comment), the Dockerfile's base images (pinned by digest) and the
# images in the compose files (pinned by tag and digest).
#
# One thing Dependabot cannot know: the Playwright container in docker-compose.e2e.yml must be
# the same version as @playwright/test in package.json. The two are proposed separately, so
# merge them together; `npm run check:containers` fails if they differ.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates in one pull request, so they cost one review, not twenty.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions held back on purpose; the README says why ("Dependency choices"). Take
      # one off this list when the tool that blocks it supports the new version.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime is Node 22 (see "Dependency choices" in the README).
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
